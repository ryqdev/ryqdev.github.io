{% assign g = site.giscus %}
{% if page.comments == false %}
  {% assign giscus_skip = true %}
{% endif %}
<div class="giscus-container">
  {% if giscus_skip %}
  {% elsif g.enabled and g.repo_id != "" and g.category_id != "" %}
    <div
      id="giscus-mount"
      data-repo="{{ g.repo }}"
      data-repo-id="{{ g.repo_id }}"
      data-category="{{ g.category }}"
      data-category-id="{{ g.category_id }}"
      data-mapping="{{ g.mapping | default: 'pathname' }}"
      data-reactions-enabled="{{ g.reactions_enabled | default: '1' }}"
      data-emit-metadata="{{ g.emit_metadata | default: '0' }}"
      data-input-position="{{ g.input_position | default: 'top' }}"
      data-lang="{{ labels.giscus_lang }}"></div>
  {% else %}
    <div class="giscus-placeholder">
      <p>{{ labels.comments_unavailable }}</p>
    </div>
  {% endif %}
</div>
