<a class="post-card" href="{{ include.post.url | relative_url }}">
  {% if include.post.tags and include.post.tags.size > 0 %}
    <div class="post-card__tags">
      {% for tag in include.post.tags %}
        <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
  {% endif %}
  <h2 class="post-card__title">{{ include.post.title }}</h2>
  {% if include.post.description %}
    <p class="post-card__description">{{ include.post.description }}</p>
  {% endif %}
  <time class="post-card__date" datetime="{{ include.post.date | date_to_xmlschema }}">
    {{ include.post.date | date: "%B %-d, %Y" }}
  </time>
</a>
