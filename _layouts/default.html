{% include locale.html %}
<!DOCTYPE html>
<html lang="{{ current_lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if page.title %}
      <title>{{ page.title }} - {{ site.title }}</title>
    {% else %}
      <title>{{ site.title }}</title>
    {% endif %}
    <meta name="description" content="{{ page.description | default: site.description }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/subscriptions.css' | relative_url }}">
    {% if page.translation_key %}
      <link rel="alternate" hreflang="en" href="{{ english_url | absolute_url }}">
      <link rel="alternate" hreflang="zh-CN" href="{{ chinese_url | absolute_url }}">
    {% endif %}
    {% include feed-links.html %}
    {% seo %}

    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    {% include top-nav.html %}

    <main class="main">
      <div class="main__inner">
        {{ content }}
      </div>
    </main>

    {% include search.html %}
    <script id="ui-strings" type="application/json">{{ labels.js | jsonify }}</script>
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
  </body>
</html>
