title: "ryqdev's Blog"
description: "Personal blog about web development, tools, and technology."
author: ryqdev
url: "https://ryqdev.github.io"
baseurl: ""

permalink: /posts/:slug/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'hljs'
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  style: compressed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      section: "Posts"
  - scope:
      path: ""
      type: pages
    values:
      layout: page

collections:
  posts:
    output: true

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md

# Giscus (GitHub Discussions–backed comments).
# To enable:
#   1. Enable Discussions on this repo (Settings → General → Features).
#   2. Install the giscus app: https://github.com/apps/giscus
#   3. Go to https://giscus.app, paste the repo, pick category "Announcements"
#      (or any category of type "Announcement"), and copy the IDs below.
giscus:
  enabled: false
  repo: "ryqdev/ryqdev.github.io"
  repo_id: ""           # data-repo-id from giscus.app
  category: "Announcements"
  category_id: ""       # data-category-id from giscus.app
  mapping: "pathname"
  reactions_enabled: "1"
  emit_metadata: "0"
  input_position: "top"
  lang: "en"
